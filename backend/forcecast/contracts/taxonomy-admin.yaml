components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    IngestionRunRequest:
      properties:
        source:
          type: string
          title: Source
          description: IngestionSource code
      type: object
      required:
      - source
      title: IngestionRunRequest
    RejectRequest:
      properties:
        reason:
          type: string
          minLength: 1
          title: Reason
      type: object
      required:
      - reason
      title: RejectRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    VersionCreateRequest:
      properties:
        version:
          type: string
          minLength: 1
          title: Version
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
      type: object
      required:
      - version
      title: VersionCreateRequest
    WebhookCreateRequest:
      properties:
        url:
          type: string
          title: Url
        events:
          items:
            type: string
          type: array
          title: Events
        secret:
          type: string
          title: Secret
      type: object
      required:
      - url
      - events
      - secret
      title: WebhookCreateRequest
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
            trace_id:
              type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT with role:admin claim
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Forcecast-Api-Key
      description: API key with prefix fk_admin_*
security:
- bearerAuth: []
- apiKeyAuth: []
