openapi: 3.1.0
info:
  title: Forcecast Taxonomy — Admin API
  version: 1.0.0
  description: 'Admin write API — 7 endpoints for approval workflow, ingestion triggering,
    taxonomy version management, and webhook registration. All endpoints require admin
    authentication via JWT bearer (role:admin) or API key prefix fk_admin_* (X-Forcecast-Api-Key).
    Rate limiting: anonymous 60/min, authenticated 300/min, admin 1000/min with headers
    X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset and 429 Retry-After.'
paths:
  /api/v1/admin/ingestion/run:
    post:
      tags:
      - admin-taxonomy
      summary: Trigger Ingestion
      operationId: trigger_ingestion_api_v1_admin_ingestion_run_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestionRunRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
          headers:
            X-RateLimit-Limit:
              schema:
                type: string
            X-RateLimit-Remaining:
              schema:
                type: string
            X-RateLimit-Reset:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Unauthorized — missing auth token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — non-admin role or invalid fk_admin_* key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests — rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: string
            X-RateLimit-Limit:
              schema:
                type: string
            X-RateLimit-Remaining:
              schema:
                type: string
            X-RateLimit-Reset:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
      - apiKeyAuth: []
