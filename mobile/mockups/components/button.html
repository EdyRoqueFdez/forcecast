<!--
  Forcecast Component: Button

  Usage:
    <button class="fc-btn fc-btn--primary">Primary</button>
    <button class="fc-btn fc-btn--secondary">Secondary</button>
    <button class="fc-btn fc-btn--ghost">Ghost</button>
    <button class="fc-btn fc-btn--danger">Danger</button>
    <button class="fc-btn fc-btn--primary" disabled>Disabled</button>
    <button class="fc-btn fc-btn--primary fc-btn--sm">Small</button>
    <button class="fc-btn fc-btn--primary fc-btn--lg">Large</button>
    <button class="fc-btn fc-btn--primary fc-btn--icon">
      <svg>...</svg>
    </button>

  Variants: primary, secondary, ghost, danger
  Sizes: sm (32px), md (40px, default), lg (48px)
  States: default, hover, active, disabled, loading
-->

<style>
  .fc-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--fc-space-2);
    font-family: var(--fc-font-sans);
    font-weight: 600;
    border: none;
    border-radius: var(--fc-radius-md);
    cursor: pointer;
    transition: all var(--fc-transition-base);
    white-space: nowrap;
    text-decoration: none;
    line-height: 1;
  }

  /* Sizes */
  .fc-btn--sm {
    height: 32px;
    padding: 0 var(--fc-space-3);
    font-size: var(--fc-text-sm);
    border-radius: var(--fc-radius-sm);
  }

  .fc-btn--md {
    height: 40px;
    padding: 0 var(--fc-space-5);
    font-size: var(--fc-text-sm);
  }

  .fc-btn--lg {
    height: 48px;
    padding: 0 var(--fc-space-6);
    font-size: var(--fc-text-base);
  }

  /* Full width */
  .fc-btn--full {
    width: 100%;
  }

  /* Icon-only */
  .fc-btn--icon {
    width: 40px;
    padding: 0;
  }

  .fc-btn--icon.fc-btn--sm { width: 32px; }
  .fc-btn--icon.fc-btn--lg { width: 48px; }

  /* Primary */
  .fc-btn--primary {
    background-color: var(--fc-primary);
    color: var(--fc-bg);
  }

  .fc-btn--primary:hover {
    background-color: var(--fc-primary-hover);
    transform: translateY(-1px);
    box-shadow: var(--fc-shadow-md);
  }

  .fc-btn--primary:active {
    transform: translateY(0);
    box-shadow: none;
  }

  /* Secondary */
  .fc-btn--secondary {
    background-color: transparent;
    color: var(--fc-text);
    border: 1px solid var(--fc-border);
  }

  .fc-btn--secondary:hover {
    border-color: var(--fc-primary);
    color: var(--fc-primary);
    background-color: var(--fc-primary-dim);
  }

  .fc-btn--secondary:active {
    transform: translateY(0);
  }

  /* Ghost */
  .fc-btn--ghost {
    background-color: transparent;
    color: var(--fc-text-2);
  }

  .fc-btn--ghost:hover {
    background-color: var(--fc-surface-2);
    color: var(--fc-text);
  }

  /* Danger */
  .fc-btn--danger {
    background-color: var(--fc-danger);
    color: #ffffff;
  }

  .fc-btn--danger:hover {
    background-color: #dc2626;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
  }

  .fc-btn--danger:active {
    transform: translateY(0);
    box-shadow: none;
  }

  /* Disabled */
  .fc-btn:disabled,
  .fc-btn[disabled] {
    opacity: 0.5;
    cursor: not-allowed;
    pointer-events: none;
    transform: none !important;
    box-shadow: none !important;
  }

  /* Loading */
  .fc-btn--loading {
    position: relative;
    color: transparent !important;
    pointer-events: none;
  }

  .fc-btn--loading::after {
    content: '';
    position: absolute;
    width: 16px;
    height: 16px;
    border: 2px solid currentColor;
    border-right-color: transparent;
    border-radius: 50%;
    animation: fc-spin 0.6s linear infinite;
  }

  .fc-btn--primary.fc-btn--loading::after {
    border-color: var(--fc-bg);
    border-right-color: transparent;
  }
</style>

<!-- Preview -->
<div style="display: flex; flex-wrap: wrap; gap: 12px; padding: 16px;">
  <button class="fc-btn fc-btn--primary fc-btn--md">Primary</button>
  <button class="fc-btn fc-btn--secondary fc-btn--md">Secondary</button>
  <button class="fc-btn fc-btn--ghost fc-btn--md">Ghost</button>
  <button class="fc-btn fc-btn--danger fc-btn--md">Danger</button>
  <button class="fc-btn fc-btn--primary fc-btn--md" disabled>Disabled</button>
  <button class="fc-btn fc-btn--primary fc-btn--md fc-btn--loading">Loading</button>
</div>
