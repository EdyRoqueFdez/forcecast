<!--
  Forcecast Component: Toast / Notification

  Usage:
    <div class="fc-toast fc-toast--success" role="alert">
      <svg class="fc-toast__icon">...</svg>
      <div class="fc-toast__content">
        <span class="fc-toast__title">Vote saved</span>
        <span class="fc-toast__message">Your vote for GPT-4o has been recorded.</span>
      </div>
      <button class="fc-toast__close" aria-label="Dismiss">×</button>
    </div>

  Variants: success, error, warning, info
  Positions: top-right, top-center, bottom-center, bottom-right
  Auto-dismiss: add data-auto-dismiss="3000" (ms)

  Position: add class fc-toast--top-right, fc-toast--bottom-center, etc.
  Stacking: multiple toasts stack vertically with fc-toast-container
-->

<style>
  .fc-toast-container {
    position: fixed;
    z-index: var(--fc-z-toast);
    display: flex;
    flex-direction: column;
    gap: var(--fc-space-2);
    pointer-events: none;
  }

  .fc-toast-container--top-right { top: var(--fc-space-4); right: var(--fc-space-4); }
  .fc-toast-container--top-center { top: var(--fc-space-4); left: 50%; transform: translateX(-50%); }
  .fc-toast-container--bottom-right { bottom: var(--fc-space-4); right: var(--fc-space-4); }
  .fc-toast-container--bottom-center { bottom: var(--fc-space-4); left: 50%; transform: translateX(-50%); }

  .fc-toast {
    display: flex;
    align-items: flex-start;
    gap: var(--fc-space-3);
    max-width: 380px;
    width: 100%;
    padding: var(--fc-space-3) var(--fc-space-4);
    background-color: var(--fc-surface);
    border: 1px solid var(--fc-border);
    border-radius: var(--fc-radius-lg);
    box-shadow: var(--fc-shadow-lg);
    pointer-events: auto;
    animation: fc-toast-in 0.3s var(--fc-ease-out);
  }

  @keyframes fc-toast-in {
    from { opacity: 0; transform: translateY(-8px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .fc-toast--exiting {
    animation: fc-toast-out 0.2s var(--fc-ease-in) forwards;
  }

  @keyframes fc-toast-out {
    to { opacity: 0; transform: translateY(-8px) scale(0.96); }
  }

  /* Variant accents (left border) */
  .fc-toast--success { border-left: 3px solid var(--fc-success); }
  .fc-toast--error { border-left: 3px solid var(--fc-danger); }
  .fc-toast--warning { border-left: 3px solid var(--fc-warning); }
  .fc-toast--info { border-left: 3px solid var(--fc-primary); }

  .fc-toast__icon {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .fc-toast--success .fc-toast__icon { color: var(--fc-success); }
  .fc-toast--error .fc-toast__icon { color: var(--fc-danger); }
  .fc-toast--warning .fc-toast__icon { color: var(--fc-warning); }
  .fc-toast--info .fc-toast__icon { color: var(--fc-primary); }

  .fc-toast__content {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }

  .fc-toast__title {
    font-size: var(--fc-text-sm);
    font-weight: 600;
    color: var(--fc-text);
  }

  .fc-toast__message {
    font-size: var(--fc-text-xs);
    color: var(--fc-text-muted);
    line-height: 1.4;
  }

  .fc-toast__close {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    background: none;
    border: none;
    border-radius: var(--fc-radius-sm);
    color: var(--fc-text-muted);
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;
    transition: all var(--fc-transition-fast);
  }

  .fc-toast__close:hover {
    background-color: var(--fc-surface-2);
    color: var(--fc-text);
  }
</style>

<!-- Preview -->
<div style="padding: 16px; display: flex; flex-direction: column; gap: 12px; max-width: 400px;">
  <div class="fc-toast fc-toast--success">
    <svg class="fc-toast__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>
    <div class="fc-toast__content">
      <span class="fc-toast__title">Vote saved</span>
      <span class="fc-toast__message">Your vote for GPT-4o has been recorded.</span>
    </div>
    <button class="fc-toast__close" aria-label="Dismiss">×</button>
  </div>

  <div class="fc-toast fc-toast--error">
    <svg class="fc-toast__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
    <div class="fc-toast__content">
      <span class="fc-toast__title">Connection lost</span>
      <span class="fc-toast__message">Your vote will be saved when you're back online.</span>
    </div>
    <button class="fc-toast__close" aria-label="Dismiss">×</button>
  </div>

  <div class="fc-toast fc-toast--warning">
    <svg class="fc-toast__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    <div class="fc-toast__content">
      <span class="fc-toast__title">Rate limited</span>
      <span class="fc-toast__message">You've voted recently. Wait 30 seconds before voting again.</span>
    </div>
    <button class="fc-toast__close" aria-label="Dismiss">×</button>
  </div>

  <div class="fc-toast fc-toast--info">
    <svg class="fc-toast__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
    <div class="fc-toast__content">
      <span class="fc-toast__title">New category available</span>
      <span class="fc-toast__message">Creative writing is now available for voting.</span>
    </div>
    <button class="fc-toast__close" aria-label="Dismiss">×</button>
  </div>
</div>
