<!--
  Forcecast Component: Footer

  Usage:
    <footer class="fc-footer">
      <div class="fc-footer__brand">
        <svg class="fc-footer__logo">...</svg>
        <span>Forcecast</span>
      </div>
      <div class="fc-footer__links">
        <a href="#">About</a>
        <a href="#">API</a>
        <a href="#">GitHub</a>
      </div>
      <p class="fc-footer__copy">Community-driven AI model rankings</p>
    </footer>

  Layout: brand, links, copyright
  Mobile: stacked center layout
-->

<style>
  .fc-footer {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--fc-space-4);
    padding: var(--fc-space-8) var(--fc-space-4);
    border-top: 1px solid var(--fc-border);
    text-align: center;
  }

  .fc-footer__brand {
    display: flex;
    align-items: center;
    gap: var(--fc-space-2);
    font-size: var(--fc-text-lg);
    font-weight: 700;
    color: var(--fc-text);
  }

  .fc-footer__logo {
    width: 24px;
    height: 24px;
    color: var(--fc-primary);
  }

  .fc-footer__links {
    display: flex;
    gap: var(--fc-space-6);
  }

  .fc-footer__links a {
    font-size: var(--fc-text-sm);
    color: var(--fc-text-muted);
    text-decoration: none;
    transition: color var(--fc-transition-fast);
  }

  .fc-footer__links a:hover {
    color: var(--fc-text);
  }

  .fc-footer__copy {
    font-size: var(--fc-text-xs);
    color: var(--fc-text-3);
    margin: 0;
  }

  /* Horizontal variant */
  .fc-footer--horizontal {
    flex-direction: row;
    justify-content: space-between;
    text-align: left;
  }

  @media (max-width: 768px) {
    .fc-footer--horizontal {
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
  }
</style>

<!-- Preview -->
<footer class="fc-footer">
  <div class="fc-footer__brand">
    <svg class="fc-footer__logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
    </svg>
    <span>Forcecast</span>
  </div>
  <div class="fc-footer__links">
    <a href="#">About</a>
    <a href="#">API</a>
    <a href="#">GitHub</a>
    <a href="#">Contact</a>
  </div>
  <p class="fc-footer__copy">Community-driven AI model rankings</p>
</footer>
